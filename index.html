<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">

    <script src="./javascript/dados.js" defer></script>
    <script src="./javascript/script.js" defer></script>
    <title>Horti-Fruti do Jão</title>
</head>
<body>

    <header>
        <h1>Horti-Fruti do Jão</h1>

        <nav>
                <a href="#">Home</a>
                <a href="#">Produtos</a>
                <a href="#">Contato</a>
        </nav>
    </header>

    <main>

        <section id="banner">
            <!-- Banner principal -->
        </section>

        <section id="filtros">
            <input type="text" id="pesquisa" 
            placeholder="Pesquisar produtos...">

            <select id="categoria">
                <option value="">Todas as categorias</option>
                <option value="fruta">Frutas</option>
                <option value="verdura">Verduras</option>
                <option value="legume">Legumes</option>
                <option value="tubérculo">Tubérculos</option>
            </select>
        </section>

        <section id="catalogo">

            <h2 class="info">Produtos</h2>
            <div id="produtos"></div>

        </section>

    </main>

    <footer>
        <p>© 2026 Horti-Fruti do Jão</p>
    </footer>

    <div id="modal" class="modal">

    <div class="modal-conteudo">

        <span id="fechar-modal">&times;</span>

        <h2 class="info">Detalhes do Produto</h2>

        <img id="modal-imagem">

        <div class="container-info">
            <h2 id="modal-nome"></h2>
            <p id="modal-categoria"></p>
            <p id="modal-unidade"></p>
            <p id="modal-preco"></p>
            <p id="modal-quantidade"></p>
            <p id="modal-status"></p>
            <p id="modal-descricao"></p>
        </div>
    </div>

</div>

</body>
</html>
